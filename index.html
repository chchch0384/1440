<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1440">
<meta name="theme-color" content="#1a1a1c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
<title>1440</title>
</head>
<body>

<!-- 設定：貼上專屬連結（只做一次） -->
<section id="scr-setup" class="screen" hidden>
  <h1 class="logo">1440</h1>
  <p class="lead">Paste your private link.</p>
  <p id="setup-warn" class="warn" hidden>You're in Safari. Add to Home Screen first, then paste it in the home screen app.</p>
  <textarea id="setup-link" rows="4" placeholder="https://chchch0384.github.io/1440/#k=…&amp;api=https://script.google.com/…" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
  <button id="setup-save" class="primary">Save</button>
  <p id="setup-msg" class="msg"></p>
  <p class="hint">It's in cell B7 of the settings tab in your 1440 Google Sheet.</p>
  <nav class="nav bottom"><button id="setup-cancel" hidden>Cancel</button></nav>
</section>

<!-- 拍照畫面 -->
<section id="scr-shoot" class="screen center" hidden>
  <div class="clock-wrap">
    <div id="clock" class="clock">--:--</div>
    <div id="minute-status" class="minute-status"></div>
    <div id="hour-progress" class="hour-progress"></div>
  </div>
  <button id="btn-shoot" class="shoot" aria-label="Take photo"></button>
  <input id="file" type="file" accept="image/*" capture="environment" hidden>
  <p id="cheat-banner" class="cheat-banner" hidden>Cheat mode</p>
  <nav class="nav bottom">
    <button id="shoot-cancel-cheat" hidden>Cancel cheat</button>
    <button id="shoot-wall">Wall</button>
  </nav>
</section>

<!-- 處理中 / 待上傳 -->
<section id="scr-pending" class="screen" hidden>
  <img id="pending-img" alt="">
  <div class="info">
    <div id="pending-title" class="title">Processing…</div>
    <div id="pending-sub" class="sub"></div>
  </div>
  <div id="pending-ask" class="ask" hidden>
    <p id="pending-ask-text"></p>
    <div class="row">
      <button id="pending-retake">Retake</button>
      <button id="pending-keep" class="primary">Keep anyway</button>
    </div>
  </div>
  <div id="pending-actions" class="row" hidden>
    <button id="pending-discard" class="danger">Discard</button>
    <button id="pending-retry" class="primary">Retry</button>
  </div>
  <p class="hint only-failed">Long-press the photo to save it to Photos.</p>
</section>

<!-- 今天已經拍過 -->
<section id="scr-today" class="screen" hidden>
  <img id="today-img" alt="">
  <div class="info">
    <div id="today-title" class="title"></div>
    <div id="today-sub" class="sub"></div>
  </div>
  <nav class="nav bottom">
    <button id="today-wall">Wall</button>
    <button id="today-book">Hours</button>
  </nav>
  <button id="today-cheat" class="cheat">cheat</button>
</section>

<!-- 總覽 -->
<section id="scr-wall" class="screen" hidden>
  <header class="bar">
    <button class="back" data-back aria-label="Back">‹</button>
    <div id="wall-progress">0/1440</div>
    <span class="bar-spacer"></span>
  </header>
  <div id="wall-labels" class="hour-labels"></div>
  <div id="wall-wrap" class="wall-wrap">
    <canvas id="wall"></canvas>
    <canvas id="wall-overlay"></canvas>
  </div>
</section>

<!-- 小時書 -->
<section id="scr-book" class="screen" hidden>
  <header class="bar">
    <button class="back" data-back aria-label="Back">‹</button>
    <div id="book-title"></div>
    <span class="bar-spacer"></span>
  </header>
  <div id="book-dots" class="dots"></div>
  <div id="book-pages" class="pages"></div>
</section>

<!-- 看單張 -->
<section id="scr-view" class="screen" hidden>
  <header class="bar">
    <button class="back" data-back aria-label="Back">‹</button>
    <div id="view-title"></div>
    <span class="bar-spacer"></span>
  </header>
  <img id="view-img" alt="">
  <div id="view-sub" class="sub"></div>
</section>

<div id="toast" hidden></div>
<script src="app.js?v=5"></script>
</body>
</html>
