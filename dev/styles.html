<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;600;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<title>1440 · style directions</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #111; color: #eee; font: 15px/1.5 Inter, -apple-system, system-ui, sans-serif; padding: calc(20px + env(safe-area-inset-top)) 0 calc(40px + env(safe-area-inset-bottom)); }
  .intro { padding: 0 20px 8px; }
  .intro h1 { font-size: 22px; font-weight: 600; }
  .intro p { color: #999; font-size: 14px; }
  section { padding: 34px 0 10px; border-top: 1px solid #222; margin-top: 20px; }
  .label { padding: 0 20px; }
  .label b { font-size: 18px; font-weight: 600; }
  .label b span { display: inline-block; width: 26px; color: #888; }
  .label p { color: #999; font-size: 14px; margin-top: 4px; max-width: 520px; }
  .row { display: flex; gap: 16px; overflow-x: auto; padding: 18px 20px 14px; scroll-snap-type: x mandatory; }
  .row::-webkit-scrollbar { display: none; }

  /* ───── 手機外框（共用） ───── */
  .phone { flex: 0 0 250px; height: 540px; border-radius: 30px; overflow: hidden; position: relative; scroll-snap-align: start; box-shadow: 0 0 0 1px #2a2a2a; }
  .scr { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 34px 18px 22px; }
  .scr.center { align-items: center; text-align: center; }
  .nav { margin-top: auto; display: flex; justify-content: center; gap: 28px; font-size: 13px; }
  .cap { position: absolute; left: 0; right: 0; bottom: -22px; text-align: center; font-size: 11px; color: #777; }

  /* 假照片：用漸層代替 */
  .ph { background-size: cover; background-position: center; }
  .phone .p1.p1 { background: linear-gradient(180deg, #7fb2e5 0%, #f4c28a 62%, #3d4a3a 63%, #26301f 100%); }
  .phone .p2.p2 { background: radial-gradient(circle at 70% 30%, #ffd98a 0 8%, transparent 9%), linear-gradient(180deg, #2b1d4e, #d9644a 70%, #1c1413 71%); }
  .phone .p3.p3 { background: linear-gradient(160deg, #1f3b2d, #4f7a4a 45%, #a9c47f 70%, #e7e2b8); }
  .phone .p4.p4 { background: radial-gradient(circle at 30% 70%, #ffb347 0 5%, transparent 6%), radial-gradient(circle at 65% 40%, #ff5e62 0 4%, transparent 5%), linear-gradient(180deg, #0d1020, #1d2340); }
  .phone .p5.p5 { background: linear-gradient(90deg, #d8d2c4 0 30%, #b9ad97 30% 55%, #e9e4d8 55%), linear-gradient(#000, #000); }
  .phone .p6.p6 { background: linear-gradient(200deg, #ffe7c2, #f59e7a 50%, #6b4a6e); }
  .phone .p7.p7 { background: radial-gradient(ellipse at 50% 90%, #3a6ea5, transparent 60%), linear-gradient(180deg, #b7d4ea, #e8f1f7); }
  .phone .p8.p8 { background: linear-gradient(135deg, #3b2a20, #8c5a3c 50%, #d8a26b); }
  .phone .p9.p9 { background: radial-gradient(circle at 50% 40%, #f7f3e8 0 18%, #c9b99a 19% 30%, #544436 31%); }
  .phone .p10.p10 { background: linear-gradient(180deg, #121212, #2e2e2e 60%, #f2c14e 61% 63%, #1a1a1a 64%); }
  .phone .p11.p11 { background: linear-gradient(120deg, #a1c4fd, #c2e9fb); }
  .phone .p12.p12 { background: linear-gradient(170deg, #5b8c5a, #cfd186 60%, #596157); }

  /* ════════ A · Darkroom：純黑、照片滿版、字很細，介面幾乎消失 ════════ */
  .A { background: #000; color: #fff; font-family: Inter; }
  .A .clock { font-size: 64px; font-weight: 300; letter-spacing: -.04em; margin-top: 40px; }
  .A .st { font-size: 13px; color: #fff; opacity: .9; margin-top: 6px; letter-spacing: .08em; text-transform: uppercase; }
  .A .st::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #ff453a; margin-right: 8px; vertical-align: 2px; }
  .A .hp { font-size: 12px; color: #666; margin-top: 4px; letter-spacing: .06em; }
  .A .btn { width: 76px; height: 76px; border-radius: 50%; border: 3px solid #fff; margin-top: 120px; display: grid; place-items: center; }
  .A .btn::after { content: ''; width: 62px; height: 62px; border-radius: 50%; background: #fff; }
  .A .nav { color: #777; text-transform: uppercase; letter-spacing: .12em; font-size: 11px; }
  .A .today { padding: 0 0 22px; }
  .A .today .photo { width: 100%; aspect-ratio: 3/4; }
  .A .today .t { padding: 14px 18px 0; font-size: 26px; font-weight: 300; letter-spacing: -.02em; }
  .A .today .s { padding: 0 18px; font-size: 12px; color: #777; letter-spacing: .06em; text-transform: uppercase; }
  .A .hours { padding: 34px 0 0; }
  .A .hd { padding: 0 18px 12px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #aaa; }
  .A .hd b { color: #fff; font-weight: 600; }
  .A .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; }
  .A .cell { aspect-ratio: 3/4; background: #0c0c0c; position: relative; }
  .A .cell i { position: absolute; left: 3px; bottom: 1px; font-size: 7px; font-style: normal; color: #444; }
  .A .cell.ph i { color: rgba(255,255,255,.8); }

  /* ════════ B · Contact sheet：印樣紙、黑墨、橘色日期印字 ════════ */
  .B { background: #eeebe3; color: #151515; font-family: "DM Mono", monospace; }
  .B .clock { font-size: 60px; font-weight: 500; letter-spacing: -.05em; margin-top: 40px; }
  .B .st { font-size: 12px; margin-top: 4px; letter-spacing: .06em; text-transform: uppercase; }
  .B .st::before { content: '■ '; color: #ff6a13; }
  .B .hp { font-size: 11px; color: #8a867c; margin-top: 2px; }
  .B .btn { width: 80px; height: 80px; border-radius: 50%; background: #151515; margin-top: 118px; box-shadow: 0 0 0 5px #eeebe3, 0 0 0 6px #151515; }
  .B .nav { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
  .B .nav span { border-bottom: 1px solid #151515; }
  .B .today .photo { width: 100%; aspect-ratio: 3/4; border: 1px solid #151515; position: relative; }
  .B .stamp { position: absolute; right: 10px; bottom: 8px; font-family: "DM Mono"; font-size: 14px; color: #ff8a2b; text-shadow: 0 0 4px rgba(255,120,30,.7); letter-spacing: .06em; }
  .B .today .t { margin-top: 14px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .B .today .s { font-size: 11px; color: #8a867c; }
  .B .hd { padding-bottom: 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; border-bottom: 1px solid #151515; margin-bottom: 10px; }
  .B .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .B .cell { aspect-ratio: 3/4; border: 1px solid #c9c4b7; position: relative; }
  .B .cell.ph { border-color: #151515; }
  .B .cell i { position: absolute; left: 2px; top: -1px; font-size: 7px; font-style: normal; color: #a19c90; }
  .B .cell.ph i { color: #ff8a2b; top: auto; bottom: 0; }

  /* ════════ C · Instant：暖灰底、照片像拍立得、襯線字當手寫標籤 ════════ */
  .C { background: #e6e1d7; color: #2a2723; font-family: Inter; }
  .C .clock { font-family: "Instrument Serif"; font-size: 78px; line-height: 1; margin-top: 36px; letter-spacing: -.01em; }
  .C .st { font-family: "Instrument Serif"; font-style: italic; font-size: 20px; margin-top: 2px; color: #b4532a; }
  .C .hp { font-size: 11px; color: #8d877b; margin-top: 2px; }
  .C .btn { width: 84px; height: 84px; border-radius: 50%; background: #2a2723; margin-top: 110px; position: relative; overflow: hidden; }
  .C .btn::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 10px; margin-top: -5px; background: linear-gradient(90deg, #e2463c 0 20%, #f39a2b 20% 40%, #f5d23b 40% 60%, #6cb85a 60% 80%, #3b8bd9 80%); }
  .C .nav { font-family: "Instrument Serif"; font-size: 17px; font-style: italic; }
  .C .today { align-items: center; }
  .C .print { background: #fbfaf6; padding: 10px 10px 34px; box-shadow: 0 10px 24px rgba(60,40,20,.22); transform: rotate(-1.5deg); width: 196px; margin-top: 10px; position: relative; }
  .C .print .photo { width: 100%; aspect-ratio: 3/4; }
  .C .print .pc { position: absolute; left: 12px; bottom: 6px; font-family: "Instrument Serif"; font-style: italic; font-size: 19px; color: #2a2723; }
  .C .today .s { margin-top: 20px; font-family: "Instrument Serif"; font-style: italic; font-size: 17px; color: #8d877b; }
  .C .hd { font-family: "Instrument Serif"; font-size: 28px; line-height: 1; padding-bottom: 14px; }
  .C .hd em { font-size: 16px; color: #8d877b; }
  .C .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .C .cell { aspect-ratio: 3/4; background: #ddd7cb; border-radius: 2px; position: relative; }
  .C .cell.ph { box-shadow: 0 0 0 2px #fbfaf6, 0 3px 6px rgba(60,40,20,.25); }
  .C .cell i { position: absolute; left: 2px; bottom: 0; font-size: 7px; font-style: normal; color: #b2ab9c; }
  .C .cell.ph i { display: none; }

  /* ════════ D · Viewfinder：黑底、相機觀景窗的角框和讀數 ════════ */
  .D { background: #0a0a0a; color: #f2f2f2; font-family: "DM Mono", monospace; }
  .D .shoot { justify-content: flex-start; }
  .D .vf { position: relative; width: 100%; aspect-ratio: 3/4; margin-top: 18px; display: grid; place-items: center; }
  .D .vf::before, .D .vf::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(#f2f2f2, #f2f2f2) top left / 16px 1.5px no-repeat, linear-gradient(#f2f2f2, #f2f2f2) top left / 1.5px 16px no-repeat,
      linear-gradient(#f2f2f2, #f2f2f2) top right / 16px 1.5px no-repeat, linear-gradient(#f2f2f2, #f2f2f2) top right / 1.5px 16px no-repeat,
      linear-gradient(#f2f2f2, #f2f2f2) bottom left / 16px 1.5px no-repeat, linear-gradient(#f2f2f2, #f2f2f2) bottom left / 1.5px 16px no-repeat,
      linear-gradient(#f2f2f2, #f2f2f2) bottom right / 16px 1.5px no-repeat, linear-gradient(#f2f2f2, #f2f2f2) bottom right / 1.5px 16px no-repeat; }
  .D .vf::after { background: linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,.08)) 33.3% 0 / 1px 100% no-repeat, linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,.08)) 66.6% 0 / 1px 100% no-repeat, linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,.08)) 0 33.3% / 100% 1px no-repeat, linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,.08)) 0 66.6% / 100% 1px no-repeat; }
  .D .clock { font-size: 50px; font-weight: 500; letter-spacing: -.04em; }
  .D .read { position: absolute; left: 10px; right: 10px; font-size: 10px; letter-spacing: .08em; display: flex; justify-content: space-between; color: #bbb; }
  .D .read.top { top: 10px; } .D .read.bot { bottom: 10px; }
  .D .rec { color: #ffb020; } .D .rec::before { content: '● '; }
  .D .btn { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #f2f2f2; margin: 34px auto 0; display: grid; place-items: center; }
  .D .btn::after { content: ''; width: 56px; height: 56px; border-radius: 50%; background: #f2f2f2; }
  .D .nav { font-size: 10px; letter-spacing: .14em; color: #888; }
  .D .today .photo { width: 100%; aspect-ratio: 3/4; position: relative; }
  .D .today .photo .read { color: #fff; text-shadow: 0 0 3px #000; }
  .D .today .t { margin-top: 14px; font-size: 12px; letter-spacing: .1em; }
  .D .today .s { font-size: 10px; color: #777; letter-spacing: .08em; }
  .D .hd { font-size: 10px; letter-spacing: .12em; padding-bottom: 12px; display: flex; justify-content: space-between; color: #bbb; }
  .D .hd b { color: #ffb020; font-weight: 400; }
  .D .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
  .D .cell { aspect-ratio: 3/4; border: 1px solid #222; position: relative; }
  .D .cell.ph { border-color: transparent; }
  .D .cell i { position: absolute; left: 2px; bottom: 0; font-size: 7px; font-style: normal; color: #444; }
  .D .cell.ph i { color: #fff; text-shadow: 0 0 2px #000; }

  /* ════════ E · Gallery：白底、大黑字、照片無縫排列，像美術館圖錄 ════════ */
  .E { background: #fff; color: #0a0a0a; font-family: Inter; }
  .E .clock { font-size: 82px; font-weight: 800; letter-spacing: -.06em; line-height: .9; margin-top: 44px; }
  .E .st { font-size: 13px; font-weight: 600; margin-top: 10px; }
  .E .st::before { content: ''; display: inline-block; width: 7px; height: 7px; background: #0a0a0a; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .E .hp { font-size: 12px; color: #999; }
  .E .btn { width: 78px; height: 78px; border-radius: 50%; background: #0a0a0a; margin-top: 108px; }
  .E .nav { font-size: 13px; font-weight: 600; }
  .E .today { padding: 0 0 22px; }
  .E .today .photo { width: 100%; aspect-ratio: 3/4; }
  .E .today .t { padding: 12px 18px 0; font-size: 34px; font-weight: 800; letter-spacing: -.05em; line-height: 1; }
  .E .today .s { padding: 4px 18px 0; font-size: 12px; color: #999; }
  .E .hours { padding: 34px 0 0; }
  .E .hd { padding: 0 18px 12px; font-size: 30px; font-weight: 800; letter-spacing: -.05em; line-height: 1; }
  .E .hd em { font-style: normal; font-size: 13px; font-weight: 600; color: #999; letter-spacing: 0; margin-left: 6px; }
  .E .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; }
  .E .cell { aspect-ratio: 3/4; background: #f3f3f3; position: relative; box-shadow: inset 0 0 0 .5px #fff; }
  .E .cell i { position: absolute; left: 3px; bottom: 1px; font-size: 7px; font-style: normal; color: #c4c4c4; }
  .E .cell.ph i { display: none; }
</style>
</head>
<body>
<div class="intro">
  <h1>Style directions</h1>
  <p>Each row shows the same three screens: shoot, today, hours. Swipe sideways inside a row. Photos are placeholders.</p>
</div>

<div id="all"></div>

<script>
  var T = [
    { k: 'A', name: 'Darkroom', note: 'Pure black, photos edge to edge, very thin type. The interface almost disappears, like iOS Photos at night. One tiny red dot is the only colour.' },
    { k: 'B', name: 'Contact sheet', note: 'Photographic paper and black ink, monospace type. Each photo carries an orange date imprint like old film cameras, which fits a project that is all about the minute.' },
    { k: 'C', name: 'Instant', note: 'Warm grey paper, photos become instant prints with a serif caption. The shutter has the rainbow stripe. The most personal and diary-like.' },
    { k: 'D', name: 'Viewfinder', note: 'Black with camera HUD: corner brackets, thirds grid, monospace readouts. The shoot screen looks through a viewfinder before you tap.' },
    { k: 'E', name: 'Gallery', note: 'White page, huge black type, photos laid edge to edge like an exhibition catalogue. Loud and graphic, photos do all the colour.' }
  ];
  var lit = { 2: 'p1', 3: 'p2', 7: 'p3', 12: 'p4', 18: 'p5', 21: 'p6', 30: 'p7', 31: 'p8', 38: 'p9', 44: 'p10', 50: 'p11', 57: 'p12' };
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function grid() {
    var h = '<div class="grid">';
    for (var m = 0; m < 60; m++) h += '<div class="cell' + (lit[m] ? ' ph ' + lit[m] : '') + '"><i>' + two(m) + '</i></div>';
    return h + '</div>';
  }
  function shoot(k) {
    if (k === 'D') return '<div class="scr shoot center"><div class="vf"><div class="read top"><span class="rec">FREE</span><span>15:21</span></div><div class="clock">15:21</div><div class="read bot"><span>HR 12/60</span><span>0213/1440</span></div></div><div class="btn"></div><div class="nav"><span>WALL</span></div></div>';
    return '<div class="scr shoot center"><div class="clock">15:21</div><div class="st">15:21 free</div><div class="hp">This hour 12/60</div><div class="btn"></div><div class="nav"><span>Wall</span></div></div>';
  }
  function today(k) {
    if (k === 'C') return '<div class="scr today center"><div class="print"><div class="photo p2"></div><div class="pc">15:21 · Sept 29</div></div><div class="s">3 moments today</div><div class="nav"><span>Wall</span><span>Hours</span></div></div>';
    var extra = k === 'B' ? '<span class="stamp">\'26 9 29 15:21</span>' : k === 'D' ? '<div class="read top"><span>2026-09-29</span><span>15:21:48</span></div><div class="read bot"><span>LIT</span><span>0213/1440</span></div>' : '';
    return '<div class="scr today"><div class="photo p2">' + extra + '</div><div class="t">Today 15:21</div><div class="s">3 moments today</div><div class="nav"><span>Wall</span><span>Hours</span></div></div>';
  }
  function hours(k) {
    var hd = {
      A: '<div class="hd"><b>15:00</b> · 12/60</div>',
      B: '<div class="hd"><span>Hour 15</span><span>12/60</span></div>',
      C: '<div class="hd">15:00 <em>twelve of sixty</em></div>',
      D: '<div class="hd"><span>HR 15:00</span><b>12/60</b></div>',
      E: '<div class="hd">15:00<em>12/60</em></div>'
    }[k];
    return '<div class="scr hours">' + hd + grid() + '</div>';
  }
  var out = '';
  T.forEach(function (t) {
    out += '<section><div class="label"><b><span>' + t.k + '</span>' + t.name + '</b><p>' + t.note + '</p></div><div class="row">' +
      '<div class="phone ' + t.k + '">' + shoot(t.k) + '</div>' +
      '<div class="phone ' + t.k + '">' + today(t.k) + '</div>' +
      '<div class="phone ' + t.k + '">' + hours(t.k) + '</div>' +
      '</div></section>';
  });
  document.getElementById('all').innerHTML = out;
</script>
</body>
</html>
